<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FornAI - Kod & Yapay Zeka Asistanı</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #1e293b; padding: 15px; text-align: center; border-bottom: 1px solid #334155; }
    header h1 { color: #38bdf8; font-size: 1.5rem; }
    #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; }
    .user-msg { background-color: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot-msg { background-color: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    pre { background-color: #090d16; padding: 10px; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 0.85rem; margin-top: 8px; color: #4ade80; }
    #input-container { display: flex; padding: 12px; background-color: #1e293b; gap: 8px; border-top: 1px solid #334155; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: white; outline: none; font-size: 0.95rem; }
    button { background-color: #2563eb; color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>

  <header>
    <h1>🎮 FornAI</h1>
  </header>

  <div id="chat-container">
    <div class="message bot-msg">
      Merhaba! Ben <b>FornAI</b>. Sana kod yazmada, sohbet etmede ve sorularını yanıtlamada yardımcı olabilirim. Nasıl yardımcı olabilirim?
    </div>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="FornAI'a bir şeyler yaz..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">Gönder</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("user-input");
      const text = input.value.trim();
      if (!text) return;

      // Kullanıcı mesajını ekle
      addMessage(text, "user-msg");
      input.value = "";

      // FornAI yanıtını simüle et
      setTimeout(() => {
        generateResponse(text);
      }, 600);
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") sendMessage();
    }

    function addMessage(text, className) {
      const chatContainer = document.getElementById("chat-container");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${className}`;
      msgDiv.innerHTML = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function generateResponse(userText) {
      const lower = userText.toLowerCase();
      let response = "";

      if (lower.includes("kod") || lower.includes("html") || lower.includes("python")) {
        response = `FornAI senin için bir kod örneği hazırladı:<br>
        <pre><code>// FornAI Örnek Kodu\nfunction merhabaFornAI() {\n  console.log("FornAI çalışıyor!");\n}\nmerhabaFornAI();</code></pre>`;
      } else if (lower.includes("merhaba") || lower.includes("selam")) {
        response = "Selam! FornAI hazır. Bugün ne yazıyoruz veya ne hakkında konuşuyoruz?";
      } else if (lower.includes("kimsin") || lower.includes("adı ne")) {
        response = "Ben **FornAI**, oyun ve kodlama odaklı yapay zeka asistanınım!";
      } else {
        response = `"${userText}" hakkındaki isteğini aldım. FornAI şu anda aktif ve sana yardımcı olmaya hazır!`;
      }

      addMessage(response, "bot-msg");
    }
  </script>

</body>
</html>
